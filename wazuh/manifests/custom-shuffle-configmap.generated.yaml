\n    sys.exit(main())\n"},"kind":"ConfigMap","metadata":{"annotations":{},"labels":{"app.kubernetes.io/name":"wazuh","soc-stack.integrations":"shuffle"},"name":"wazuh-custom-shuffle","namespace":"wazuh"}}
