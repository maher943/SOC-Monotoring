apiVersion: v1
kind: Service
metadata:
  name: thehive-sov-nodeport
  namespace: default
  labels:
    app.kubernetes.io/name: thehive
    app.kubernetes.io/instance: thehive-sov
    app.kubernetes.io/component: nodeport
spec:
  type: NodePort
  selector:
    app.kubernetes.io/component: server
    app.kubernetes.io/instance: thehive-sov
    app.kubernetes.io/name: thehive
  ports:
    - name: http
      port: 9000
      targetPort: http
      nodePort: 30090
      protocol: TCP
